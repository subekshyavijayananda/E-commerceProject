<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contactstyle.css">
</head>
<body>

    <!-- ===== Navbar ===== -->
    <nav class="navbar">
        <div class="logo"></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="product.html">Product</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <!-- ===== Dark hero section ===== -->
    <section class="hero">
        <h1>Contact Us</h1>
        <p class="hero-subtitle">
            We'd love to hear from you. Send us your questions or feedback.
        </p>
    </section>

    <!-- ===== Contact section (white background) ===== -->
    <section class="contact-section">
        <div class="contact-box">

            <div class="contact-info">
                <h2>Get in Touch</h2>

                <p><strong>Email:</strong> stylewear@gmail.com</p>
                <p><strong>Phone:</strong> +977 9800000000</p>
                <p><strong>Address:</strong> Kathmandu, Nepal</p>
            </div>

            <form class="contact-form">

                <input type="text" placeholder="Your Name" required>

                <input type="email" placeholder="Your Email" required>

                <textarea placeholder="Your Message" rows="6" required></textarea>

                <button type="submit">Send Message</button>

            </form>

        </div>
    </section>

    <!-- ===== Dark CTA banner ===== -->
    <section class="cta-banner">
        <h2>Want to Hear From Us?</h2>
        <a href="#" class="cta-button">Follow Up</a>
    </section>

    <!-- ===== Footer ===== -->
    <footer class="footer">
        <p>&copy; 2026 STUDIO. All rights reserved.</p>
    </footer>

</body>
</html>
